<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f0e4">
<meta name="description" content="蒋栎斌的作品集入口：三维地图与个人主页。">
<title>蒋栎斌 · 作品</title>
<style>
  :root {
    /* 配色沿用三维地图那一套暖调，两处视觉语言保持一致 */
    --paper:      #f7f0e4;   /* 宣纸米白，与地图 theme-color 同值 */
    --paper-deep: #efe5d4;
    --card:       #fffdf9;
    --ink:        #2c2420;   /* 深棕墨 */
    --ink-soft:   #6f6257;
    --ink-faint:  #9a8c7f;
    --line:       #e3d8c7;
    --red:        #c9422c;   /* 主色，与地图详情面板同源 */
    --red-deep:   #a8331f;
    --amber:      #e8a13c;
    --radius:     16px;
    --shadow:     0 1px 2px rgba(44, 36, 32, .05), 0 8px 24px -12px rgba(44, 36, 32, .18);
    --shadow-lift:0 2px 4px rgba(44, 36, 32, .06), 0 18px 40px -16px rgba(44, 36, 32, .28);
  }

  *, *::before, *::after { box-sizing: border-box; }

  html { color-scheme: light; }

  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: clamp(24px, 5vw, 64px) clamp(20px, 5vw, 40px);
    background-color: var(--paper);
    /* 极淡的暖色光晕，避免大面积纯色显得平板 */
    background-image:
      radial-gradient(60ch 60ch at 12% -10%, rgba(232, 161, 60, .13), transparent 70%),
      radial-gradient(50ch 50ch at 100% 110%, rgba(201, 66, 44, .10), transparent 72%);
    background-attachment: fixed;
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.65;
    -webkit-font-smoothing: antialiased;
  }

  .wrap { width: 100%; max-width: 1040px; margin: 0 auto; }

  /* ---------- 页头 ---------- */
  .eyebrow {
    margin: 0 0 10px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--red);
  }

  h1 {
    margin: 0 0 10px;
    font-size: clamp(30px, 5.2vw, 44px);
    line-height: 1.2;
    letter-spacing: -.01em;
    font-weight: 700;
  }

  .lede {
    margin: 0 0 clamp(28px, 4.5vw, 44px);
    max-width: 46ch;
    color: var(--ink-soft);
    font-size: clamp(15px, 1.6vw, 17px);
  }

  /* ---------- 两张卡片 = 两个入口 ---------- */
  .entries {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: clamp(16px, 2.4vw, 26px);
  }

  .entry {
    display: flex;
    flex-direction: column;
    overflow: hidden;
    border: 1px solid var(--line);
    border-radius: var(--radius);
    background: var(--card);
    box-shadow: var(--shadow);
    color: inherit;
    text-decoration: none;              /* 整张卡片就是按钮 */
    transition: transform .22s ease, box-shadow .22s ease, border-color .22s ease;
  }

  .entry:hover,
  .entry:focus-visible {
    transform: translateY(-4px);
    border-color: rgba(201, 66, 44, .38);
    box-shadow: var(--shadow-lift);
  }

  .entry:focus-visible {
    outline: 3px solid var(--red);
    outline-offset: 3px;
  }

  /* 视觉区：地图用真实截图，个人主页用同尺寸的暖色图形块 */
  .entry__media {
    position: relative;
    aspect-ratio: 4 / 3;
    background: linear-gradient(150deg, #f3e7d3, #e9d9c1);
    overflow: hidden;
  }

  .entry__media img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: left center;
  }

  .entry__media svg { display: block; width: 100%; height: 100%; }

  .entry__body {
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 18px 20px 20px;
  }

  .entry__title {
    margin: 0;
    font-size: 19px;
    font-weight: 700;
    letter-spacing: -.01em;
  }

  .entry__desc {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14.5px;
    line-height: 1.6;
  }

  .entry__cta {
    margin-top: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 14.5px;
    font-weight: 600;
    color: var(--red);
  }

  .entry__cta svg { transition: transform .22s ease; }
  .entry:hover .entry__cta svg,
  .entry:focus-visible .entry__cta svg { transform: translateX(4px); }

  /* ---------- 页脚 ---------- */
  footer {
    margin-top: clamp(28px, 4.5vw, 44px);
    padding-top: 18px;
    border-top: 1px solid var(--line);
    display: flex;
    flex-wrap: wrap;
    gap: 8px 18px;
    justify-content: space-between;
    color: var(--ink-faint);
    font-size: 13px;
  }

  footer a { color: var(--ink-soft); text-decoration: none; border-bottom: 1px solid var(--line); }
  footer a:hover { color: var(--red); border-bottom-color: var(--red); }

  /* ---------- 窄屏：单列 ---------- */
  @media (max-width: 760px) {
    .entries { grid-template-columns: minmax(0, 1fr); }
  }

  @media (prefers-reduced-motion: reduce) {
    .entry, .entry__cta svg { transition: none; }
    .entry:hover, .entry:focus-visible { transform: none; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <p class="eyebrow">Portfolio</p>
    <h1>蒋栎斌</h1>
    <p class="lede">宁波大学。这里是我的两个入口 —— 一个是正在做的三维地图，一个是个人主页。</p>
  </header>

  <main class="entries">

    <a class="entry" href="./map/">
      <div class="entry__media">
        <img src="./assets/map-preview.jpg"
             alt="甬城红迹三维地图的界面预览：浙江省地图上的道路网与红色场馆旗帜"
             width="1040" height="780" loading="eager" decoding="async">
      </div>
      <div class="entry__body">
        <h2 class="entry__title">甬城红迹 · 三维地图</h2>
        <p class="entry__desc">浙江省红色场馆的三维悬浮沙盘，省 → 市 → 区县 → 场馆四级下钻，可查看场馆详情与驾车步行路线。</p>
        <span class="entry__cta">进入地图
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h13M13 6l6 6-6 6"/>
          </svg>
        </span>
      </div>
    </a>

    <a class="entry" href="./profile/">
      <div class="entry__media">
        <!-- 纯几何图形，不用任何真实照片或生成图 -->
        <svg viewBox="0 0 400 300" role="img" aria-label="个人主页示意图">
          <defs>
            <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#f6ead6"/>
              <stop offset="100%" stop-color="#eddcc2"/>
            </linearGradient>
            <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#c9422c"/>
              <stop offset="100%" stop-color="#a8331f"/>
            </linearGradient>
          </defs>
          <rect width="400" height="300" fill="url(#g1)"/>
          <circle cx="322" cy="72" r="46" fill="#e8a13c" opacity=".26"/>
          <circle cx="72" cy="246" r="58" fill="#c9422c" opacity=".12"/>
          <rect x="104" y="58" width="192" height="184" rx="12" fill="#fffdf9" opacity=".92"/>
          <circle cx="200" cy="112" r="26" fill="url(#g2)" opacity=".9"/>
          <path d="M170 168c0-16.6 13.4-30 30-30s30 13.4 30 30" fill="none" stroke="#c9422c"
                stroke-width="9" stroke-linecap="round" opacity=".55"/>
          <rect x="140" y="188" width="120" height="9" rx="4.5" fill="#d8c7ad"/>
          <rect x="158" y="208" width="84" height="9" rx="4.5" fill="#e2d4be"/>
          <rect x="146" y="228" width="108" height="9" rx="4.5" fill="#e2d4be"/>
        </svg>
      </div>
      <div class="entry__body">
        <h2 class="entry__title">个人主页</h2>
        <p class="entry__desc">关于我、我的项目、技能与联系方式。</p>
        <span class="entry__cta">前往主页
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M5 12h13M13 6l6 6-6 6"/>
          </svg>
        </span>
      </div>
    </a>

  </main>

  <footer>
    <span>© 2026 蒋栎斌</span>
    <span><a href="https://github.com/Bin-nbu">GitHub</a></span>
  </footer>

</div>
</body>
</html>
