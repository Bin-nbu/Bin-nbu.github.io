<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#f7f0e4">
<meta name="robots" content="noindex, nofollow">
<title>受保护的页面</title>
<style>
  :root {
    --paper: #f7f0e4;
    --card: #fffdf9;
    --ink: #2c2420;
    --ink-soft: #6f6257;
    --ink-faint: #9a8c7f;
    --line: #e3d8c7;
    --red: #c9422c;
    --red-deep: #a8331f;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html { color-scheme: light; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background-color: var(--paper);
    background-image:
      radial-gradient(46ch 46ch at 15% -10%, rgba(232,161,60,.14), transparent 70%),
      radial-gradient(40ch 40ch at 100% 110%, rgba(201,66,44,.11), transparent 72%);
    color: var(--ink);
    font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC",
                 "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .gate {
    width: 100%;
    max-width: 380px;
    padding: 32px 28px 26px;
    border: 1px solid var(--line);
    border-radius: 16px;
    background: var(--card);
    box-shadow: 0 1px 2px rgba(44,36,32,.05), 0 18px 40px -18px rgba(44,36,32,.25);
    text-align: center;
  }
  .lock {
    width: 46px; height: 46px;
    margin: 0 auto 14px;
    color: var(--red);
  }
  h1 {
    margin: 0 0 6px;
    font-size: 19px;
    letter-spacing: -.01em;
  }
  .hint {
    margin: 0 0 22px;
    font-size: 13.5px;
    color: var(--ink-faint);
  }
  label { display: block; text-align: left; }
  input[type="password"] {
    width: 100%;
    padding: 12px 14px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: #fff;
    color: var(--ink);
    font: inherit;
    font-size: 16px;           /* 16px 以下 iOS 会自动放大，别调小 */
    letter-spacing: .18em;
    transition: border-color .18s ease, box-shadow .18s ease;
  }
  input[type="password"]:focus {
    outline: none;
    border-color: var(--red);
    box-shadow: 0 0 0 3px rgba(201,66,44,.13);
  }
  button {
    width: 100%;
    margin-top: 12px;
    padding: 12px 16px;
    border: 1px solid var(--red-deep);
    border-radius: 10px;
    background: var(--red);
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
    transition: background .18s ease, transform .18s ease;
  }
  button:hover:not(:disabled) { background: var(--red-deep); }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .6; cursor: default; }
  .remember {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-top: 14px;
    font-size: 13.5px;
    color: var(--ink-soft);
    cursor: pointer;
    text-align: left;
  }
  .remember input { width: 15px; height: 15px; accent-color: var(--red); cursor: pointer; }
  .msg {
    min-height: 20px;
    margin-top: 12px;
    font-size: 13.5px;
    color: var(--red);
  }
  .msg.busy { color: var(--ink-faint); }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
  [hidden] { display: none !important; }
</style>
</head>
<body>

<div class="gate" id="gate">
  <svg class="lock" viewBox="0 0 24 24" fill="none" stroke="currentColor"
       stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <rect x="4" y="10.5" width="16" height="10.5" rx="2.2"/>
    <path d="M8 10.5V7a4 4 0 0 1 8 0v3.5"/>
    <circle cx="12" cy="15.6" r="1.3" fill="currentColor" stroke="none"/>
  </svg>
  <h1>这个页面需要密码</h1>
  <p class="hint">内容已加密，输对密码才能打开</p>

  <form id="form" autocomplete="off">
    <label for="pw" class="sr-only"></label>
    <input id="pw" type="password" inputmode="numeric" placeholder="请输入密码"
           autocomplete="current-password" autofocus>
    <button id="go" type="submit">进入</button>
    <label class="remember">
      <input id="remember" type="checkbox" checked>
      <span>记住这台设备</span>
    </label>
  </form>
  <p class="msg" id="msg" role="status" aria-live="polite"></p>
</div>

  const enc = new TextEncoder();
  const base = await crypto.subtle.importKey(
    'raw', enc.encode(password), 'PBKDF2', false, ['deriveKey'],
  );
  return crypto.subtle.deriveKey(
    { name: 'PBKDF2', salt: SALT, iterations: ITERATIONS, hash: 'SHA-256' },
    base, { name: 'AES-GCM', length: 256 }, false, ['decrypt'],
  );
}

async function decrypt(password) {
  const key = await deriveKey(password);
  const plain = await crypto.subtle.decrypt(
    { name: 'AES-GCM', iv: PAYLOAD.subarray(0, 12) }, key, PAYLOAD.subarray(12),
  );
  return new TextDecoder().decode(plain);
}

function reveal(html) {
  const frame = document.createElement('iframe');
  frame.title = '个人主页';
  frame.setAttribute('referrerpolicy', 'no-referrer');
  frame.srcdoc = html;
  document.body.replaceChildren(frame);
}

async function attempt(password, { silent } = {}) {
  if (!password) return false;
  if (!silent) {
    msg.textContent = '正在解锁…';
    msg.className = 'msg busy';
    go.disabled = true;
  }
  try {
    const html = await decrypt(password);
    if (remember.checked) {
      try { localStorage.setItem(STORE_KEY, password); } catch {}
    } else {
      try { localStorage.removeItem(STORE_KEY); } catch {}
    }
    reveal(html);
    return true;
  } catch {
    try { localStorage.removeItem(STORE_KEY); } catch {}
    if (!silent) {
      msg.textContent = '密码不对，再试一次';
      msg.className = 'msg';
    }
    return false;
  } finally {
    if (!silent) go.disabled = false;
  }
}

form.addEventListener('submit', (e) => {
  e.preventDefault();
  attempt(pw.value);
});

// 支持 WebCrypto 才继续；老浏览器直接说清楚，别让人对着空页面猜
if (!(window.crypto && window.crypto.subtle)) {
  msg.textContent = '当前浏览器不支持解密，请换新版 Chrome / Edge / Safari';
  go.disabled = true;
} else {
  let saved = null;
  try { saved = localStorage.getItem(STORE_KEY); } catch {}
  if (saved) attempt(saved, { silent: true });
}
</script>
